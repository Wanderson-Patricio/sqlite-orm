name: Publicar no PyPI

on:
  push:
    tags:
      - 'v*' # O fluxo só vai rodar quando você enviar uma tag que comece com "v" (ex: v1.0.1)

jobs:
  pypi-publish:
    name: Fazer upload do pacote para o PyPI
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/p/python_sqlite3_orm # Lembre de ajustar se você mudou o nome do pacote
      
    permissions:
      id-token: write  # Essa linha é essencial para o Trusted Publisher funcionar
      contents: read
      
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar ferramentas de construção
        run: python -m pip install --upgrade pip build

      - name: Construir os arquivos do pacote
        run: python -m build

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1